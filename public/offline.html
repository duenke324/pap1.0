<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem ligação · Gestão Escolar</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #202020;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0d0d0d; color: #ececec; }
      button { background: #ffffff; color: #000000; }
    }
    .caixa { max-width: 360px; }
    img { width: 72px; height: 72px; margin-bottom: 16px; border-radius: 16px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; opacity: .75; }
    button {
      font: inherit;
      padding: 10px 22px;
      border-radius: 8px;
      border: 0;
      background: #000000;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="caixa">
    <img src="/static/icons/icon-192.png" alt="">
    <h1>Sem ligação à internet</h1>
    <p>Não foi possível carregar esta página. Verifique a sua ligação e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
